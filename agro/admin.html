<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Cuentas de finca · panel</title>
<link rel="stylesheet" href="style.css?v=1">
<style>.wrap{max-width:760px}.row{flex-wrap:wrap}.row>*{min-width:120px}.code{font:700 20px/1 "Barlow Condensed",monospace;letter-spacing:1px}.st{font-size:14px;font-weight:700;padding:2px 8px;border-radius:999px;border:2px solid var(--tinta)}.st.on{background:var(--hoja);color:#fff;border-color:var(--hoja)}.st.off{background:var(--surco)}.st.low{background:var(--sol);color:#14261a}.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}pre{white-space:pre-wrap;background:var(--campo);border:2px solid var(--surco);border-radius:8px;padding:10px;font:inherit;font-size:16px;margin:8px 0}</style>
</head><body>
<header class="top"><div class="in"><span class="brand">Panel · Cuentas de finca</span><button id="out" class="link hide" type="button">Salir</button></div></header>
<div class="wrap">
<section class="card" id="login"><h2>Entrar</h2><p class="sub">Use la clave AGRO_ADMIN_KEY (o ADMIN_PASSWORD) de Netlify.</p><form id="fl"><label for="k">Clave</label><input id="k" type="password" autocomplete="current-password"><p class="err hide" id="le" role="alert"></p><button class="btn" style="margin-top:12px" type="submit">Entrar</button></form></section>
<div id="panel" class="hide">
<section class="card"><h2>Crear código</h2><form id="fc"><label for="nota">Nombre o contacto <span class="hint">Solo lo ve usted. Ej.: Don Mario, 8888-0000, café.</span></label><input id="nota" maxlength="120">
<div class="chips" id="pre" style="margin-top:10px"></div>
<div class="row"><div><label for="cr">Créditos</label><input id="cr" inputmode="numeric" value="8"></div><div><label for="dd">Vigencia (días)</label><input id="dd" inputmode="decimal" value="1"></div><div><label for="tp">Tipo</label><select id="tp"><option value="prueba">Prueba</option><option value="pago">Pagado</option></select></div></div>
<p class="err hide" id="ce" role="alert"></p><button class="btn" style="margin-top:12px" type="submit">Crear código</button></form>
<div id="nuevo" class="hide"><h3 style="margin-top:18px">Listo. Envíele esto:</h3><pre id="msg"></pre><div class="acts"><button class="btn sm" id="cpm" type="button">Copiar mensaje</button><a class="btn ghost sm" id="wam" target="_blank" rel="noopener" href="#">Abrir en WhatsApp</a></div></div></section>
<section class="card flat"><h2>Códigos</h2><p class="sub" id="resumen"></p><div id="lista"></div></section>
</div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)},h=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var K=''; try{K=sessionStorage.getItem('agro_k')||''}catch(e){}
var PERM=false,D={packs:[],trial:{creditos:8,horas:24}};
function call(body){return fetch('/.netlify/functions/agro-admin',{method:'POST',headers:{'Content-Type':'application/json','x-agro-admin':K},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){j.__s=r.status;return j})}).catch(function(){return{error:'Sin conexión.',__s:0}})}
function fecha(i){if(!i)return'no vence';var d=new Date(i),ms=d-Date.now();return(ms<=0?'venció ':'vence ')+d.toLocaleString('es-CR',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
function PERMMSG(cod,link){return'Hola, ya le activé Cuentas de finca para siempre. Gracias por su pago.\n\nSu código: '+cod+'\n\nEntre aquí y se abre solo: '+link+'\n\nSin límite de cálculos, mientras el servicio exista. Guarde este mensaje: con ese código entra desde cualquier celular.'}
function load(){return call({accion:'listar'}).then(function(j){
  if(j.__s!==200){$('#panel').classList.add('hide');$('#login').classList.remove('hide');$('#out').classList.add('hide');$('#le').textContent=j.error||'No se pudo entrar.';$('#le').classList.remove('hide');return}
  D=j;$('#login').classList.add('hide');$('#panel').classList.remove('hide');$('#out').classList.remove('hide');
  $('#pre').innerHTML='<button type="button" data-p="1" data-t="pago" class="sol">Para siempre</button><button type="button" data-c="'+D.trial.creditos+'" data-d="'+(D.trial.horas/24)+'" data-t="prueba">Prueba '+D.trial.creditos+' créditos · '+D.trial.horas+' h</button>'+D.packs.filter(function(p){return !p.permanente}).map(function(p){return'<button type="button" data-c="'+p.creditos+'" data-d="'+p.dias+'" data-t="pago">'+h(p.nombre)+'</button>'}).join('');
  var on=D.codigos.filter(function(c){return c.activo&&c.creditos>c.usados&&(!c.vence||new Date(c.vence)>new Date())}).length;
  $('#resumen').textContent=D.codigos.length+' códigos · '+on+' activos con créditos · '+D.codigos.filter(function(c){return c.tipo==='pago'}).length+' de pago';
  $('#lista').innerHTML=D.codigos.length?D.codigos.map(function(c){var rest=c.creditos-c.usados,venc=c.vence&&new Date(c.vence)<=new Date(),est=!c.activo?['off','Desactivado']:c.ilimitado?['on','Para siempre']:venc?['off','Vencido']:rest<=0?['off','Sin créditos']:rest<=2?['low','Casi sin créditos']:['on','Activo'];
   return'<div class="card flat" style="margin:10px 0"><div class="kv" style="border:0"><span class="code">'+h(c.codigo)+'</span><span class="st '+est[0]+'">'+est[1]+'</span></div><div>'+h(c.nota||'(sin nota)')+' · <b>'+(c.tipo==='pago'?'pagó':'prueba')+'</b>'+(c.ilimitado?' · licencia permanente':'')+(c.recargas?' · '+c.recargas+' recarga'+(c.recargas>1?'s':''):'')+'</div><div class="sub">'+(c.ilimitado?'Usó '+c.usados+' veces · sin límite de créditos':'Usó '+c.usados+' de '+c.creditos+' · '+h(fecha(c.vence)))+(c.ultimo_uso?' · último uso '+new Date(c.ultimo_uso).toLocaleString('es-CR',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):' · sin usar')+'</div><div class="acts">'+(c.ilimitado?'':'<button class="btn sm sol" data-perm="'+h(c.codigo)+'" type="button">Activar para siempre</button>'+D.packs.filter(function(p){return !p.permanente}).map(function(p){return'<button class="btn sm ghost" data-r="'+h(c.codigo)+'" data-c="'+p.creditos+'" data-d="'+p.dias+'" type="button">Recargar +'+p.creditos+'</button>'}).join(''))+'<button class="btn sm ghost" data-a="'+(c.activo?'desactivar':'activar')+'" data-k="'+h(c.codigo)+'" type="button">'+(c.activo?'Desactivar':'Activar')+'</button></div></div>'}).join(''):'<p class="sub">Todavía no hay códigos.</p>'})}
$('#fl').onsubmit=function(e){e.preventDefault();K=$('#k').value;try{sessionStorage.setItem('agro_k',K)}catch(x){}load()};
$('#out').onclick=function(){K='';try{sessionStorage.removeItem('agro_k')}catch(e){}$('#panel').classList.add('hide');$('#login').classList.remove('hide');$('#out').classList.add('hide')};
$('#pre').onclick=function(e){var b=e.target.closest('button');if(!b)return;PERM=!!b.dataset.p;$('#cr').value=PERM?'0':b.dataset.c;$('#dd').value=PERM?'':b.dataset.d;$('#tp').value=b.dataset.t;$('#cr').disabled=$('#dd').disabled=PERM;if(PERM)$('#tp').value='pago'};
$('#fc').onsubmit=function(e){e.preventDefault();$('#ce').classList.add('hide');var btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
 call({accion:'crear',nota:$('#nota').value,creditos:$('#cr').value,dias:String($('#dd').value).replace(',','.'),tipo:$('#tp').value,permanente:PERM}).then(function(j){btn.disabled=false;
  if(j.__s!==200){$('#ce').textContent=j.error||'No se pudo crear.';$('#ce').classList.remove('hide');return}
  var link=location.origin+'/agro/?c='+encodeURIComponent(j.codigo),prueba=!PERM&&$('#tp').value==='prueba',t=PERM?PERMMSG(j.codigo,link):prueba?'Hola, aquí está su código de prueba de Cuentas de finca: '+j.codigo+'\n\nEntre aquí y se abre solo: '+link+'\n\nTiene '+j.creditos+' créditos para '+(Number($('#dd').value)===1?'hoy':'usar durante '+$('#dd').value+' días')+'. Cada cálculo gasta 1. Si le sirve, no espere a que se acaben: pague cuando quiera por SINPE Móvil y le sumo créditos a este mismo código, lo que le sobre no se pierde.':'Hola, ya le activé su código de Cuentas de finca: '+j.codigo+'\n\nEntre aquí: '+link+'\n\nTiene '+j.creditos+' créditos. Gracias por su pago.';
  $('#msg').textContent=t;$('#wam').href='https://wa.me/?text='+encodeURIComponent(t);$('#nuevo').classList.remove('hide');$('#cpm').onclick=function(){var b=this;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent='Copiado'},function(){b.textContent='Seleccione y copie'})};load()})};
$('#lista').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.r){if(!confirm('¿Recargar '+b.dataset.c+' créditos a '+b.dataset.r+'? Solo hágalo si ya vio el SINPE.'))return;b.disabled=true;call({accion:'recargar',codigo:b.dataset.r,creditos:b.dataset.c,dias:b.dataset.d}).then(function(j){if(j.__s!==200){alert(j.error||'No se pudo.');b.disabled=false;return}var t='Listo, ya le recargué su código '+j.codigo+'. Le quedan '+j.restantes+' créditos. Gracias.';$('#nuevo').classList.remove('hide');$('#msg').textContent=t;$('#wam').href='https://wa.me/?text='+encodeURIComponent(t);$('#cpm').onclick=function(){var x=this;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){x.textContent='Copiado'},function(){x.textContent='Seleccione y copie'})};load();window.scrollTo({top:0,behavior:'smooth'})})}
 else if(b.dataset.perm){if(!confirm('¿Activar «Para siempre» a '+b.dataset.perm+'? Solo hágalo si ya vio el SINPE.'))return;b.disabled=true;call({accion:'recargar',codigo:b.dataset.perm,permanente:true}).then(function(j){if(j.__s!==200){alert(j.error||'No se pudo.');b.disabled=false;return}var t='Listo, ya le activé su código '+j.codigo+' para siempre, sin límite de cálculos. Gracias por su pago.';$('#nuevo').classList.remove('hide');$('#msg').textContent=t;$('#wam').href='https://wa.me/?text='+encodeURIComponent(t);$('#cpm').onclick=function(){var x=this;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){x.textContent='Copiado'},function(){x.textContent='Seleccione y copie'})};load();window.scrollTo({top:0,behavior:'smooth'})})}
 else if(b.dataset.a){call({accion:b.dataset.a,codigo:b.dataset.k}).then(load)}};
if(K)load();
})();
</script></body></html>
