<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Pendientes Boda - Kari & Lau</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8e5568; --primary-hover: #754353; --primary-light: #f3ecef; --accent: #dfad76;
            --bg-color: #fcf8f8; --card-bg: #ffffff; --text-main: #2b2527; --text-muted: #756e71; --border-color: #ebd7de;
            --shadow-subtle: 0 10px 30px -5px rgba(142, 85, 104, 0.08); --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.02);
            --border-radius: 16px; --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2.5rem 1rem; }
        .container { width: 100%; max-width: 780px; }
        header { text-align: center; margin-bottom: 2.5rem; padding: 0 0.5rem; }
        .couple-photo-container { width: 130px; height: 130px; margin: 0 auto 1.2rem auto; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent); box-shadow: 0 8px 20px rgba(223, 173, 118, 0.25); }
        .couple-photo-container img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
        h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 5vw, 2.8rem); color: var(--text-main); font-weight: 600; letter-spacing: -0.5px; }
        .sync-status { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.6rem; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(142, 85, 104, 0.04); padding: 4px 12px; border-radius: 20px; width: fit-content; margin-left: auto; margin-right: auto; }
        .sync-dot { width: 7px; height: 7px; border-radius: 50%; background-color: #ccc; }
        .sync-dot.online { background-color: #5bb361; }
        .sync-dot.syncing { background-color: #e09f3e; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 1.75rem; box-shadow: var(--shadow-subtle); margin-bottom: 2rem; border: 1px solid var(--border-color); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); }
        .form-group { margin-bottom: 1.1rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
        @media(max-width: 580px) { .form-row { grid-template-columns: 1fr; } body { padding: 1.25rem 0.75rem; } .card { padding: 1.25rem; } }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], textarea, select { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; font-family: inherit; font-size: 0.95rem; color: var(--text-main); background: #faf6f7; transition: var(--transition); }
        input[type="text"]:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(142, 85, 104, 0.1); }
        button.btn-primary { background-color: var(--primary); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 10px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: var(--transition); width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(142, 85, 104, 0.2); }
        button.btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(142, 85, 104, 0.3); }
        .tasks-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem; padding: 0 0.2rem; }
        .tasks-header h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text-main); }
        .task-list { display: flex; flex-direction: column; gap: 1rem; }
        .task-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 1.25rem 1.5rem; box-shadow: var(--shadow-card); border: 1px solid var(--border-color); display: flex; align-items: flex-start; gap: 1.1rem; transition: var(--transition); }
        .task-card:hover { box-shadow: var(--shadow-subtle); border-color: rgba(142, 85, 104, 0.3); transform: translateY(-2px); }
        .task-card.completed { background-color: #f7f3f4; opacity: 0.7; border-color: #eadce1; }
        .task-card.completed .task-title { text-decoration: line-through; color: var(--text-muted); }
        .task-checkbox { margin-top: 5px; width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; border-radius: 4px; }
        .task-content { flex: 1; min-width: 0; }
        .task-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.35rem; word-break: break-word; color: var(--text-main); }
        .task-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 0.4rem; font-size: 0.75rem; }
        .badge { background: var(--primary-light); color: var(--primary); padding: 3px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px; }
        .task-notes { font-size: 0.9rem; color: var(--text-muted); background: #faf6f7; padding: 0.6rem 0.85rem; border-radius: 8px; margin-top: 0.5rem; border-left: 3px solid var(--accent); word-break: break-word; line-height: 1.4; }
        .task-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; transition: var(--transition); padding: 8px; border-radius: 8px; }
        .btn-icon:hover { color: var(--primary); background: var(--primary-light); }
        .btn-icon.delete:hover { color: #c94a4a; background: rgba(201, 74, 74, 0.08); }
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-style: italic; background: var(--card-bg); border-radius: var(--border-radius); border: 1px solid var(--border-color); box-shadow: var(--shadow-card); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="couple-photo-container"><img src="https://bodakariylau.netlify.app/boda.jpg" alt="Kari y Lau"></div>
            <h1>Nuestra Boda 💍</h1>
            <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">Conectando…</span></div>
        </header>

        <div class="card">
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Descripción del pendiente</label>
                    <input type="text" id="taskTitle" required maxlength="300" placeholder="¿Qué hay que hacer?">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskAssignee">Responsable</label>
                        <select id="taskAssignee"><option value="Ambos">Ambos</option><option value="Kari">Kari</option><option value="Lau">Lau</option></select>
                    </div>
                    <div class="form-group">
                        <label for="taskNotes">Notas adicionales (opcional)</label>
                        <input type="text" id="taskNotes" maxlength="600" placeholder="Detalles o contactos...">
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn"><i class="fa-solid fa-plus"></i> Agregar Pendiente</button>
            </form>
        </div>

        <div class="tasks-header">
            <h2>Lista de Tareas</h2>
            <button class="btn-primary" style="width: auto; padding: 0.4rem 0.9rem; font-size: 0.85rem;" onclick="loadTasks()"><i class="fa-solid fa-rotate"></i> Actualizar</button>
        </div>
        <div id="taskList" class="task-list"><div class="empty-state">Cargando pendientes...</div></div>
    </div>

    <script>
        // Los datos viven en Supabase; la página habla con /.netlify/functions/boda (sin claves en el navegador).
        const API = '/.netlify/functions/boda';
        let tasks = [], editingId = null, busy = false;
        const syncDot = document.getElementById('syncDot'), syncText = document.getElementById('syncText');
        const setStatus = (s, t) => { syncDot.className = 'sync-dot ' + s; syncText.textContent = t; };

        async function call(body, okText) {
            setStatus('syncing', 'Sincronizando...');
            try {
                const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                const j = await r.json().catch(() => ({}));
                if (!r.ok || !j.tasks) throw new Error(j.error || 'http');
                tasks = j.tasks; renderTasks(); setStatus('online', okText || 'Sincronizado al día'); return true;
            } catch (e) { console.error(e); setStatus('', 'Error de conexión'); return false; }
        }
        const loadTasks = () => call({ action: 'list' });

        function renderTasks() {
            const box = document.getElementById('taskList');
            if (!tasks.length) { box.innerHTML = '<div class="empty-state">No hay pendientes registrados. ¡Agrega uno nuevo!</div>'; return; }
            box.innerHTML = tasks.map(t => `
                <div class="task-card ${t.completed ? 'completed' : ''}">
                    <input type="checkbox" class="task-checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTask(${t.id})" aria-label="Completado">
                    <div class="task-content">
                        <div class="task-meta"><span class="badge"><i class="fa-solid fa-user"></i> ${escapeHtml(t.assignee)}</span></div>
                        <div class="task-title">${escapeHtml(t.title)}</div>
                        ${t.notes ? `<div class="task-notes"><i class="fa-solid fa-note-sticky"></i> ${escapeHtml(t.notes)}</div>` : ''}
                    </div>
                    <div class="task-actions">
                        <button class="btn-icon" onclick="editTask(${t.id})" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-icon delete" onclick="deleteTask(${t.id})" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`).join('');
        }

        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault(); if (busy) return; busy = true;
            const title = document.getElementById('taskTitle').value, assignee = document.getElementById('taskAssignee').value, notes = document.getElementById('taskNotes').value;
            const ok = await call(editingId !== null ? { action: 'update', id: editingId, title, assignee, notes } : { action: 'add', title, assignee, notes }, 'Guardado correctamente');
            busy = false;
            if (!ok) { alert('Hubo un problema al guardar. Intenta de nuevo.'); return; }
            editingId = null; document.getElementById('taskForm').reset();
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-plus"></i> Agregar Pendiente';
        });

        async function toggleTask(id) {
            const t = tasks.find(x => x.id === id); if (!t) return;
            if (!await call({ action: 'toggle', id, completed: !t.completed }, 'Guardado correctamente')) { alert('Hubo un problema al guardar. Intenta de nuevo.'); renderTasks(); }
        }
        function editTask(id) {
            const t = tasks.find(x => x.id === id); if (!t) return;
            document.getElementById('taskTitle').value = t.title; document.getElementById('taskAssignee').value = t.assignee; document.getElementById('taskNotes').value = t.notes || '';
            editingId = t.id; document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-check"></i> Actualizar Pendiente';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        async function deleteTask(id) {
            if (!confirm('¿Estás seguro de eliminar este pendiente?')) return;
            if (!await call({ action: 'delete', id }, 'Guardado correctamente')) alert('Hubo un problema al eliminar. Intenta de nuevo.');
        }
        function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
        loadTasks();
        setInterval(() => { if (!document.hidden && !busy) loadTasks(); }, 60000);   // si Kari o Lau cambian algo, se ve solo
    </script>
</body>
</html>
