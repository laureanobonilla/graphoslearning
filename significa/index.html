<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Significa</title>
<meta name="description" content="Di una palabra y te cuenta qué significa, en voz alta y por escrito.">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="/significa/manifest.webmanifest">
<link rel="apple-touch-icon" href="/significa/apple-touch-icon.png">
<style>
:root{--bg:#0a0e1a;--ink:#eef1fa;--mute:#98a3c2;--a:#2dd4bf;--b:#8b5cf6;--lvl:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#141a35 0%,var(--bg) 60%);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
.stage{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:100%;height:clamp(250px,46vh,420px);margin-top:2vh}
#mic{position:relative;width:min(68vw,300px);height:min(68vw,300px);max-height:100%;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#05121a;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 0 0 rgba(45,212,191,.0),0 18px 60px rgba(45,212,191,.25);display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .3s}
#mic:active{transform:scale(.97)}
#mic:focus-visible{outline:3px solid #fff;outline-offset:6px}
#mic svg{width:34%;height:34%}
#mic::before,#mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--a);opacity:0;pointer-events:none}
body[data-s=idle] #mic{animation:breathe 3.2s ease-in-out infinite}
body[data-s=listen] #mic{transform:scale(calc(1 + var(--lvl)*.22));box-shadow:0 0 0 calc(var(--lvl)*46px) rgba(45,212,191,.18),0 18px 70px rgba(139,92,246,.45)}
body[data-s=listen] #mic::before{animation:ring 1.6s ease-out infinite}
body[data-s=think] #mic{animation:think 1.1s ease-in-out infinite;filter:saturate(.8)}
body[data-s=speak] #mic::before{animation:ring 2s ease-out infinite}body[data-s=speak] #mic::after{animation:ring 2s ease-out .9s infinite}
@keyframes breathe{50%{box-shadow:0 0 0 14px rgba(45,212,191,.08),0 18px 60px rgba(45,212,191,.35)}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes think{50%{transform:scale(.94)}}
.say{margin:6px 0 0;min-height:1.6em;text-align:center;color:var(--mute);font-size:1rem}
.res{width:100%;max-width:560px;text-align:center;margin-top:14px}
.word{font-size:clamp(2rem,9vw,3.1rem);font-weight:750;line-height:1.1;margin:0 0 12px;letter-spacing:-.01em;overflow-wrap:anywhere}
.def{font-size:clamp(1.1rem,4.4vw,1.35rem);line-height:1.55;margin:0;color:var(--ink)}
.res.fade{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.err{color:#fbbf24}
.alt{margin-top:auto;padding-top:26px;width:100%;max-width:420px;text-align:center}
#typeLink{background:none;border:0;color:var(--mute);font:inherit;font-size:.92rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px}
#typeLink:focus-visible,#typeGo:focus-visible{outline:2px solid #fff;outline-offset:3px}
#typeForm{display:flex;gap:8px}#typeForm[hidden]{display:none}
#typeIn{flex:1;min-width:0;background:#0d1226;border:1px solid #2a3355;color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem}
#typeGo{border:1px solid #2a3355;background:#141a35;color:var(--ink);border-radius:12px;padding:0 16px;font:600 .95rem system-ui,sans-serif;cursor:pointer}
#stop{display:none;margin:14px auto 0;min-height:52px;min-width:170px;padding:0 26px;border-radius:999px;border:2px solid var(--ink);background:rgba(255,255,255,.08);color:var(--ink);font:650 1.05rem system-ui,sans-serif;cursor:pointer;align-items:center;justify-content:center;gap:10px}
#stop::before{content:"";width:14px;height:14px;border-radius:3px;background:currentColor}
body[data-s=speak] #stop{display:inline-flex}
#stop:active{transform:scale(.97)}#stop:focus-visible{outline:3px solid #fff;outline-offset:4px}
@media (prefers-reduced-motion:reduce){#mic,#mic::before,#mic::after,.res.fade{animation:none!important}}
</style></head>
<body data-s="idle"><main>
<div class="stage"><button id="mic" type="button" aria-label="Tocar para decir una palabra"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor" stroke="none"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V22"/></svg></button></div>
<p id="say" class="say" role="status" aria-live="polite">Toca el círculo y di una palabra</p>
<button id="stop" type="button" aria-label="Detener la lectura">Detener</button>
<section id="res" class="res" hidden aria-live="polite"><h1 id="word" class="word"></h1><p id="def" class="def"></p></section>
<div class="alt"><button id="typeLink" type="button" aria-expanded="false" aria-controls="typeForm">¿Prefieres escribirla?</button>
<form id="typeForm" hidden autocomplete="off"><input id="typeIn" type="text" maxlength="80" placeholder="Escribe una palabra" aria-label="Escribe la palabra" enterkeyhint="search" autocapitalize="off" spellcheck="false"><button id="typeGo" type="submit">Buscar</button></form></div>
</main>
<script>window.GK_INSTALL_KEY='sig_install_seen'</script>
<script src="/install.js?v=2"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var SR=16000, MAX_MS=8000, WAIT_MS=6000, SIL_MS=1100, MIN_SPEECH_MS=140;
var state='idle', rec=null, token=0;
function setState(s,msg){state=s;document.body.dataset.s=s;if(msg!=null)$('say').textContent=msg;}
function say(msg,err){var e=$('say');e.textContent=msg;e.classList.toggle('err',!!err);}
// ---- registro de uso (misma tabla de eventos, app = significa)
var anon=(function(){try{var k='sig_anon',v=localStorage.getItem(k);if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));localStorage.setItem(k,v)}return v}catch(e){return 'x'+Date.now()}})();
function track(ev,md){try{fetch('/.netlify/functions/qer-track-event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:ev,anonId:anon,app:'significa',metadata:md||{}}),keepalive:true}).catch(function(){})}catch(e){}}
track('opened');

// ---- voz del dispositivo (se "desbloquea" con el primer toque: iOS no deja hablar sin un gesto previo)
var synth=window.speechSynthesis, unlocked=false, speakTok=0;
function unlock(){if(!synth||unlocked)return;unlocked=true;try{var u=new SpeechSynthesisUtterance(' ');u.volume=0;synth.speak(u)}catch(e){}}
function pickVoice(lang){var vs=synth?synth.getVoices():[];var p=String(lang||'es').toLowerCase();var base=p.split('-')[0];
  return vs.filter(function(v){return v.lang&&v.lang.toLowerCase().replace('_','-')===p})[0]||vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(base)===0})[0]||null}
function say1(text,lang,done){
  var fin=false,end=function(){if(!fin){fin=true;done()}};
  try{var u=new SpeechSynthesisUtterance(text);u.lang=lang||'es';var v=pickVoice(lang);if(v)u.voice=v;u.rate=1;u.onend=end;u.onerror=end;
    setTimeout(end,Math.max(3000,text.length*110));synth.speak(u)}catch(e){end()}   // red de seguridad: algunos navegadores nunca avisan que terminaron
}
// La palabra se dice en SU idioma y la definición siempre en español.
function speak(word,wordLang,def,done){
  if(!synth){done();return}
  try{synth.cancel()}catch(e){}
  var tok=++speakTok,same=String(wordLang||'es').toLowerCase().split('-')[0]==='es';
  if(same)say1(word+'. '+def,'es',function(){if(tok===speakTok)done()});
  else say1(word,wordLang,function(){if(tok!==speakTok)return;say1(def,'es',function(){if(tok===speakTok)done()})});
}
function stopSpeaking(){speakTok++;try{synth&&synth.cancel()}catch(e){}}

// ---- grabación: se queda con la voz en PCM, detecta cuándo dejas de hablar y la manda como WAV de 16 kHz
function wavB64(chunks,inRate){
  var n=0;chunks.forEach(function(c){n+=c.length});var all=new Float32Array(n),o=0;chunks.forEach(function(c){all.set(c,o);o+=c.length});
  var ratio=inRate/SR,len=Math.floor(all.length/ratio),pcm=new Int16Array(len);
  for(var i=0;i<len;i++){var a=Math.floor(i*ratio),b=Math.min(all.length,Math.floor((i+1)*ratio)),s=0,c=0;for(var j=a;j<b;j++){s+=all[j];c++}var v=c?s/c:0;v=Math.max(-1,Math.min(1,v));pcm[i]=v<0?v*0x8000:v*0x7fff}
  var buf=new ArrayBuffer(44+len*2),dv=new DataView(buf);
  function w(off,str){for(var k=0;k<str.length;k++)dv.setUint8(off+k,str.charCodeAt(k))}
  w(0,'RIFF');dv.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,len*2,true);
  new Int16Array(buf,44).set(pcm);
  var bytes=new Uint8Array(buf),bin='',CH=0x8000;for(var p=0;p<bytes.length;p+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(p,p+CH));
  return btoa(bin);
}
async function startRecording(){
  var my=++token;
  var stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){setState('idle');say(e&&e.name==='NotAllowedError'?'Necesito permiso para usar el micrófono. Actívalo en el navegador y toca de nuevo.':'No encontré un micrófono para usar.',true);track('mic_error',{name:e&&e.name});return}
  if(my!==token){stream.getTracks().forEach(function(t){t.stop()});return}
  var AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(4096,1,1),mute=ctx.createGain();mute.gain.value=0;
  var chunks=[],t0=performance.now(),speechMs=0,lastVoice=0,started=false,noise=0.008,calib=0,done=false,smooth=0;
  rec={stop:function(){finish(true)},cancel:function(){finish(false)}};
  setState('listen','Te escucho…');
  proc.onaudioprocess=function(ev){
    if(done)return;var d=ev.inputBuffer.getChannelData(0);chunks.push(new Float32Array(d));
    var s=0;for(var i=0;i<d.length;i++)s+=d[i]*d[i];var rms=Math.sqrt(s/d.length),now=performance.now(),el=now-t0;
    smooth=smooth*.6+rms*.4;document.documentElement.style.setProperty('--lvl',Math.min(1,smooth*9).toFixed(2));
    if(el<350){noise=Math.max(noise,Math.min(rms*1.5,0.03));calib++;return}      // aprende el ruido de fondo al inicio
    var thr=Math.max(0.018,noise*3);
    if(rms>thr){if(!started){started=true}lastVoice=now;speechMs+=d.length/ctx.sampleRate*1000}
    if(started&&now-lastVoice>SIL_MS)finish(true);
    else if(!started&&el>WAIT_MS)finish(true);
    else if(el>MAX_MS)finish(true);
  };
  src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
  function finish(send){
    if(done)return;done=true;rec=null;
    try{proc.disconnect();src.disconnect()}catch(e){}stream.getTracks().forEach(function(t){t.stop()});
    var rate=ctx.sampleRate;try{ctx.close()}catch(e){}
    document.documentElement.style.setProperty('--lvl','0');
    if(!send||my!==token)return;
    if(!started||speechMs<MIN_SPEECH_MS){setState('idle');say('No alcancé a escucharte. Toca el círculo e inténtalo otra vez.');track('no_speech');return}
    lookup({audio:wavB64(chunks,rate)},my);
  }
}
async function lookup(payload,my){
  setState('think','Buscando qué significa…');var t0=Date.now();
  try{
    var r=await fetch('/.netlify/functions/significa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({anonId:anon},payload))});
    var d=await r.json().catch(function(){return {}});
    if(my!==token)return;
    if(r.status===429){setState('idle');say('Vas muy rápido. Espera un momento y vuelve a intentar.',true);return}
    if(!r.ok)throw new Error(d.error||('e'+r.status));
    if(!d.understood){setState('idle');say('No entendí la palabra. Toca el círculo e inténtalo otra vez.');track('not_understood');return}
    show(d);track('result',{word:d.word,lang:d.wordLang,seconds:Math.round((Date.now()-t0)/100)/10});
    setState('speak','Toca el círculo para otra palabra');
    speak(d.word,d.wordLang,d.definition,function(){if(state==='speak'&&my===token)setState('idle','Toca el círculo para otra palabra')});
  }catch(e){if(my!==token)return;setState('idle');say('No pude buscarlo ahora. Toca el círculo e inténtalo otra vez.',true);track('lookup_error',{reason:String(e.message).slice(0,80)})}
}
function show(d){var s=$('res');s.hidden=false;$('word').textContent=d.word;$('def').textContent=d.definition;s.classList.remove('fade');void s.offsetWidth;s.classList.add('fade');$('say').classList.remove('err')}

// ---- detener la lectura al instante (botón, tecla Esc o Espacio)
function stopNow(){if(state!=='speak')return;stopSpeaking();setState('idle','Toca el círculo para otra palabra');track('stopped')}
$('stop').addEventListener('click',stopNow);
document.addEventListener('keydown',function(e){if(e.key==='Escape')stopNow()});
// ---- escribir la palabra (opción secundaria)
$('typeLink').addEventListener('click',function(){var f=$('typeForm'),open=f.hidden;f.hidden=!open;this.setAttribute('aria-expanded',String(open));if(open){this.hidden=true;setTimeout(function(){$('typeIn').focus()},30);track('type_opened')}});
$('typeForm').addEventListener('submit',function(ev){ev.preventDefault();var t=$('typeIn').value.trim();if(!t)return;
  unlock();token++;if(rec)rec.cancel();stopSpeaking();$('say').classList.remove('err');$('typeIn').blur();
  track('typed_lookup');lookup({text:t},token)});
// ---- un solo botón: grande, siempre activo
$('mic').addEventListener('click',function(){
  unlock();
  if(state==='listen'&&rec){rec.stop();return}            // tocar mientras escucha = "ya terminé"
  token++;if(rec)rec.cancel();stopSpeaking();$('say').classList.remove('err');
  startRecording();track('record_start');
});
if(synth&&synth.addEventListener)synth.addEventListener('voiceschanged',function(){});
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('Este navegador no deja usar el micrófono. Puedes escribir la palabra aquí abajo.',true);$('mic').disabled=true;$('typeLink').click()}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('/significa/sw.js',{scope:'/significa/'}).catch(function(){})}catch(e){}}
// ofrece instalarla al entrar (solo si aún no está instalada)
if(window.GK_INSTALL)window.GK_INSTALL.maybe(false,{name:'Significa',desktop:true});
})();
</script></body></html>
