<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vestirte · panel privado</title>
<style>
:root{--bg:#f1f3f2;--ink:#1b2a41;--soft:#4a5a70;--line:#b9c2cc;--chalk:#d1495b;--ok:#2f7d5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
input,button{font:inherit;min-height:44px;border-radius:10px;border:2px solid var(--ink);padding:0 14px;background:#fff}
input{flex:1 1 220px}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--ink);color:#fff}
button.danger{border-color:var(--chalk);color:var(--chalk)}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.head{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:baseline}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--line)}
.badge.paid{background:var(--ok);color:#fff}
.badge.warn{background:var(--chalk);color:#fff}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.photos figure{margin:0;font-size:.8rem;color:var(--soft)}
.photos img,.photos .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--bg);display:block}
.photos .ph{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:600}
dl{margin:8px 0 0}
dt{font-weight:600;margin-top:8px}
dd{margin:0;color:var(--soft)}
.sw{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:.85rem}
.sw i{width:14px;height:14px;border-radius:50%;border:1px solid #0003;display:inline-block}
#msg{color:var(--chalk);min-height:1.5em}
</style>
</head>
<body>
<main>
  <h1>Vestirte · sesiones y fotos</h1>
  <div class="bar">
    <input id="key" type="password" placeholder="Clave de administración" autocomplete="off" aria-label="Clave de administración">
    <button id="load" class="primary">Ver sesiones</button>
    <button id="purge">Borrar fotos vencidas</button>
  </div>
  <p id="msg" role="status"></p>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SLOTS = ['rostro', 'frente', 'espalda', 'perfil', 'torso'];
try { $('key').value = sessionStorage.getItem('vst_admin_key') || ''; } catch {}

async function api(body, raw) {
  const res = await fetch('/.netlify/functions/vst-admin', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': $('key').value }, body: JSON.stringify(body) });
  if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || `Error ${res.status}`); }
  return raw ? res.blob() : res.json();
}
const sw = arr => (arr || []).map(c => `<span class="sw"><i style="background:${esc(c.hex)}"></i>${esc(c.name)}</span>`).join('');

async function load() {
  $('msg').textContent = 'Cargando…';
  try {
    const { sessions } = await api({ action: 'list', limit: 80 });
    try { sessionStorage.setItem('vst_admin_key', $('key').value); } catch {}
    $('msg').textContent = `${sessions.length} sesiones`;
    $('list').innerHTML = sessions.map(s => {
      const p = s.profile || {}, a = Array.isArray(s.answers) ? s.answers : [];
      const photos = Array.isArray(s.photos) ? s.photos : [];
      return `<article class="card" data-id="${esc(s.id)}">
        <div class="head"><strong>${esc(p.styleName || 'Sin perfil')}</strong>
          <span>${new Date(s.created_at).toLocaleString('es')} ${s.paid ? '<span class="badge paid">Pagó</span>' : '<span class="badge">No pagó</span>'}
          ${s.photos_deleted_at ? `<span class="badge warn">Fotos borradas (${esc(s.deleted_reason || '')})</span>` : ''}</span></div>
        <div class="photos">${s.photos_deleted_at || !photos.length ? '<div class="ph">Sin fotos</div>' : SLOTS.map(sl => { const ph = photos.find(x => x.slot === sl); return `<figure>${ph ? `<img alt="${sl}" data-pid="${esc(ph.public_id)}">` : '<div class="ph">—</div>'}${sl}</figure>`; }).join('')}</div>
        <div>${sw(p.bestColors)}</div>
        <details><summary>Perfil y respuestas</summary>
          <dl><dt>Resumen</dt><dd>${esc(p.summary)}</dd>${a.map(x => `<dt>${esc(x.question)}</dt><dd>${esc(x.answer)}</dd>`).join('')}</dl></details>
        ${photos.length && !s.photos_deleted_at ? `<p><button class="danger" data-del="${esc(s.id)}">Borrar sus fotos</button></p>` : ''}
      </article>`;
    }).join('');
    document.querySelectorAll('img[data-pid]').forEach(async img => {
      try { img.src = URL.createObjectURL(await api({ action: 'photo', publicId: img.dataset.pid }, true)); }
      catch { img.replaceWith(Object.assign(document.createElement('div'), { className: 'ph', textContent: 'No disponible' })); }
    });
  } catch (e) { $('msg').textContent = e.message; $('list').innerHTML = ''; }
}
$('load').onclick = load;
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
$('purge').onclick = async () => {
  try { const r = await api({ action: 'purge' }); $('msg').textContent = `Plazo ${r.days} días: ${r.sessions} sesiones limpiadas, ${r.photos} fotos borradas.`; load(); }
  catch (e) { $('msg').textContent = e.message; }
};
$('list').addEventListener('click', async e => {
  const id = e.target.dataset && e.target.dataset.del; if (!id) return;
  if (!confirm('¿Borrar las fotos de esta sesión?')) return;
  try { await api({ action: 'delete', id }); load(); } catch (err) { $('msg').textContent = err.message; }
});
</script>
</body>
</html>
