<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- CRÍTICO PARA MÓVILES: Evita el zoom automático y hace que se sienta como App Nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapas Conceptuales AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #network-container { width: 100%; height: 100%; outline: none; }
        .vis-network:focus { outline: none; }
        /* Transición suave para el loader */
        #loader.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 h-screen flex flex-col overflow-hidden text-slate-800">
    
    <!-- Notificador de Carga Flotante (Adaptado a móvil) -->
    <div id="loader" class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-full bg-indigo-600 text-white px-4 py-2 md:px-6 md:py-3 rounded-b-xl shadow-lg font-semibold z-50 flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none text-sm md:text-base whitespace-nowrap">
        <svg class="animate-spin h-4 w-4 md:h-5 md:w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span id="loaderText">Procesando...</span>
    </div>

    <!-- Cabecera Responsive (Se apila en móviles) -->
    <header class="bg-white/70 backdrop-blur-lg border-b border-slate-200 shadow-sm p-3 md:px-6 md:py-4 flex flex-col md:flex-row justify-between items-center z-10 gap-3 md:gap-0">
        <div class="flex justify-between items-center w-full md:w-auto">
            <h1 class="text-xl md:text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 tracking-tight">Graphos AI</h1>
            <!-- Botón guardar: En móvil se ubica arriba a la derecha para ahorrar espacio -->
            <button id="btnSave" class="md:ml-4 bg-white border border-slate-300 text-slate-700 px-3 py-1.5 md:px-5 md:py-2 rounded-lg font-semibold hover:bg-slate-50 hover:shadow-sm transition-all text-sm md:text-base">Guardar</button>
        </div>
        <div class="flex gap-2 w-full md:w-auto">
            <input type="text" id="topicInput" placeholder="Tema central..." class="border border-slate-300 rounded-lg px-3 py-2 w-full md:w-72 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-slate-700 text-sm md:text-base">
            <button id="btnGenerate" class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white px-4 py-2 rounded-lg font-semibold hover:shadow-md hover:opacity-90 transition-all text-sm md:text-base whitespace-nowrap">Generar</button>
        </div>
    </header>

    <div class="flex flex-1 h-full relative">
        <!-- Lienzo del Grafo -->
        <div id="network-container" class="flex-1 h-full cursor-crosshair"></div>

        <!-- Menú Flotante (Centrado automático sobre el nodo y sin desbordarse) -->
        <div id="actionMenu" class="hidden absolute bg-white/95 backdrop-blur-md shadow-2xl rounded-xl border border-slate-200 z-50 flex flex-col overflow-hidden transform -translate-x-1/2 -translate-y-full min-w-[160px] md:min-w-[180px] transition-all">
            <button id="btnMenuExpand" class="px-4 py-3 md:px-5 hover:bg-indigo-50 text-indigo-700 font-semibold text-sm text-left border-b border-slate-100 flex items-center gap-2 transition-colors">
                <span class="text-lg">✨</span> Expandir Ramas
            </button>
            <button id="btnMenuDefine" class="px-4 py-3 md:px-5 hover:bg-purple-50 text-purple-700 font-semibold text-sm text-left flex items-center gap-2 transition-colors">
                <span class="text-lg">📖</span> Leer Definición
            </button>
        </div>

        <!-- Panel Lateral (Ocupa 100% en móvil, 33% en escritorio) -->
        <div id="sidePanel" class="w-full md:w-1/3 md:min-w-[350px] bg-white/95 backdrop-blur-xl border-l border-slate-200 shadow-2xl p-6 md:p-8 overflow-y-auto transform transition-transform duration-300 translate-x-full absolute right-0 top-0 h-full z-40">
            <button id="btnClosePanel" class="text-slate-400 hover:text-slate-700 mb-6 font-bold flex items-center gap-1 text-sm tracking-wide uppercase transition-colors">
                ✕ Cerrar Panel
            </button>
            <h2 id="panelTitle" class="text-2xl md:text-3xl font-extrabold mb-4 md:mb-6 text-slate-800 tracking-tight">Concepto</h2>
            <div id="panelContent" class="text-slate-600 leading-relaxed text-base md:text-lg selection:bg-indigo-100">
                <!-- La definición irá aquí -->
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
