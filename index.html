<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- CRÍTICO PARA MÓVILES: Evita el zoom automático y hace que se sienta como App Nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Graphikosmos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        #network-container { width: 100%; height: 100%; outline: none; }
        .vis-network:focus { outline: none; }
        #loader.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 h-screen flex flex-col overflow-hidden text-slate-800">
    
    <!-- Notificador de Carga Flotante -->
    <div id="loader" class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-full bg-indigo-600 text-white px-4 py-2 md:px-6 md:py-3 rounded-b-xl shadow-lg font-semibold z-50 flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none text-sm md:text-base whitespace-nowrap">
        <svg class="animate-spin h-4 w-4 md:h-5 md:w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span id="loaderText">Procesando...</span>
    </div>

    <!-- Banner de Modo Conexión -->
    <div id="connectionBanner" class="absolute top-16 left-1/2 transform -translate-x-1/2 bg-amber-500 text-white px-6 py-2 rounded-full shadow-lg font-bold z-40 hidden flex items-center gap-3 cursor-pointer hover:bg-amber-600 transition-colors">
        <span>🔗 Toca el nodo destino para conectarlos</span>
        <span class="bg-amber-700 rounded-full px-2 py-0.5 text-xs">Cancelar ✕</span>
    </div>

    <!-- Cabecera Responsive -->
    <header class="bg-white/70 backdrop-blur-lg border-b border-slate-200 shadow-sm p-3 md:px-6 md:py-4 flex flex-col md:flex-row justify-between items-center z-10 gap-3 md:gap-0">
        <div class="flex justify-between items-center w-full md:w-auto">
            <h1 class="text-xl md:text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 tracking-tight">Graphikosmos</h1>
            <button id="btnSave" class="md:ml-4 bg-white border border-slate-300 text-slate-700 px-3 py-1.5 md:px-5 md:py-2 rounded-lg font-semibold hover:bg-slate-50 hover:shadow-sm transition-all text-sm md:text-base">Guardar</button>
        </div>
        <div class="flex gap-2 w-full md:w-auto">
            <input type="text" id="topicInput" placeholder="Tema central..." class="border border-slate-300 rounded-lg px-3 py-2 w-full md:w-72 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm text-slate-700 text-sm md:text-base">
            <button id="btnGenerate" class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white px-4 py-2 rounded-lg font-semibold hover:shadow-md hover:opacity-90 transition-all text-sm md:text-base whitespace-nowrap">Generar</button>
        </div>
    </header>

    <div class="flex flex-1 h-full relative">
        <!-- Lienzo del Grafo -->
        <div id="network-container" class="flex-1 h-full cursor-crosshair"></div>

        <!-- Menú Flotante de Acciones Unificado -->
        <div id="actionMenu" class="hidden absolute bg-white/95 backdrop-blur-md shadow-2xl rounded-xl border border-slate-200 z-50 flex flex-col overflow-hidden transform -translate-x-1/2 -translate-y-full min-w-[220px] transition-all">
            
            <!-- Selector de Nodos -->
            <div class="px-4 py-3 bg-slate-50 border-b border-slate-100 flex justify-between items-center text-sm text-slate-600">
                <span class="font-medium">Nuevos nodos:</span>
                <input type="number" id="nodeCount" min="1" max="10" value="3" class="w-14 text-center border border-slate-300 rounded-md py-1 focus:outline-none focus:border-indigo-500">
            </div>

            <button id="btnMenuExpand" class="px-5 py-3 hover:bg-indigo-50 text-indigo-700 font-semibold text-sm text-left border-b border-slate-100 flex items-center gap-2 transition-colors">
                <span class="text-lg">✨</span> Expandir Ramas
            </button>
            <button id="btnMenuExamples" class="px-5 py-3 hover:bg-amber-50 text-amber-600 font-semibold text-sm text-left border-b border-slate-100 flex items-center gap-2 transition-colors">
                <span class="text-lg">💡</span> Dar Ejemplos
            </button>
            <button id="btnMenuDefine" class="px-5 py-3 hover:bg-purple-50 text-purple-700 font-semibold text-sm text-left border-b border-slate-100 flex items-center gap-2 transition-colors">
                <span class="text-lg">📖</span> Cargar Definición
            </button>
            <button id="btnMenuConnect" class="px-5 py-3 hover:bg-emerald-50 text-emerald-700 font-semibold text-sm text-left border-b border-slate-100 flex items-center gap-2 transition-colors">
                <span class="text-lg">🔗</span> Unir con...
            </button>
            <button id="btnMenuDelete" class="px-5 py-3 hover:bg-red-50 text-red-600 font-semibold text-sm text-left border-b border-slate-100 flex items-center gap-2 transition-colors">
                <span class="text-lg">🗑️</span> Eliminar
            </button>

            <!-- Controles de Tamaño -->
            <div class="px-4 py-3 bg-slate-50 flex justify-between items-center text-sm text-slate-600">
                <span class="font-medium">Tamaño de caja:</span>
                <div class="flex gap-2">
                    <button id="btnSizeMinus" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 px-3 py-1 rounded-md font-bold shadow-sm">-</button>
                    <button id="btnSizePlus" class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 px-3 py-1 rounded-md font-bold shadow-sm">+</button>
                </div>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
