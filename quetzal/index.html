<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2a2a">
<title>Quetzal · vuelo por Costa Rica</title>
<meta name="description" content="Vuela como un quetzal sobre volcanes, nubes, Pacífico y Caribe. Juego para el teléfono, con música de marimba.">
<link rel="stylesheet" href="style.css?v=1">
</head><body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="row"><span id="score">0</span><span id="lives"></span></div>
  <div id="zone"></div>
  <div id="toast"></div>
  <button id="mute" aria-label="Sonido">♪</button>
</div>
<div id="flash"></div>
<section id="menu">
  <h1>Quetzal</h1>
  <p class="sub">Vuela por Costa Rica</p>
  <p class="how">Desliza el dedo para volar. Recoge las esferas doradas y esquiva rocas, ramas y halcones. Si el teléfono lo permite, también puedes inclinarlo.</p>
  <button id="play" class="big">Volar</button>
  <label class="tilt"><input type="checkbox" id="tilt"> Controlar inclinando el teléfono</label>
  <p id="best"></p>
</section>
<section id="end" hidden>
  <h2>¡Pura vida!</h2>
  <p id="res"></p>
  <button id="again" class="big">Volar otra vez</button>
</section>
<script type="module" src="game.js?v=1"></script>
</body></html>
